<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC2 배포 테스트</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Spring Boot on EC2</h1>
        </div>
        
        <div class="content">
            <div class="card success">
                <h2 th:text="${message}">배포 성공!</h2>
            </div>
            
            <div class="card info">
                <h3>📊 서버 정보</h3>
                <ul>
                    <li><strong>현재 시간:</strong> <span th:text="${currentTime}"></span></li>
                    <li><strong>서버 환경:</strong> <span th:text="${serverInfo}"></span></li>
                    <li><strong>애플리케이션:</strong> EC2 Test App v1.0.0</li>
                </ul>
            </div>
            
            <div class="card">
                <h3>✅ 동작 확인</h3>
                <p>이 페이지가 보인다면 Spring Boot 애플리케이션이 정상적으로 실행 중입니다.</p>
                <a href="/health" class="button">Health Check</a>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2025 EC2 Test Application | Spring Boot 3.2.0</p>
        </div>
    </div>
</body>
</html>
