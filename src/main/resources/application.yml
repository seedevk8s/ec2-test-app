# Server Configuration
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://library-db.cpgm666m0izc.ap-northeast-2.rds.amazonaws.com:3306/library # RDS 인스턴스 엔드포인>트
    username: admin # RDS 마스터 사용자 이름
    password: 12345678 # RDS 마스터 암호
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update                               # 기존 테이블 유지하고 변경사항만 업데이트
    show-sql: true                                   # 실행되는 SQL 쿼리 콘솔 출력
    properties:
      hibernate:
        format_sql: true                             # SQL 쿼리 포맷팅해서 출력 (읽기 쉽게)
        dialect: org.hibernate.dialect.MySQLDialect  # MySQL 방언 설정

# Spring Configuration
  application:
    name: ec2-test-app
  
  # Thymeleaf Configuration
  thymeleaf:
    cache: false                          # 개발 시 HTML 수정 후 즉시 반영 (운영: true)
    prefix: classpath:/templates/         # 템플릿 파일 위치 (컨트롤러에서 파일명만 반환 가능)
    suffix: .html                         # 템플릿 확장자 자동 추가 (index → index.html)
    encoding: UTF-8                       # 한글 깨짐 방지
  
  # Jackson: JSON 변환 라이브러리의 타임존 설정 (REST API 응답 시 한국 시간 사용)
  jackson:
    time-zone: Asia/Seoul

# Logging Configuration
logging:
  level:
    root: INFO                                       # 전체 애플리케이션 로그 레벨
    com.example.demo: DEBUG                          # 프로젝트 패키지는 상세 로그 출력
    org.hibernate.SQL: DEBUG                         # Hibernate SQL 로그
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # 쿼리 파라미터 값 로그
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
